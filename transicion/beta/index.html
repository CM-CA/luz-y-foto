<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ollada</title>
  <noscript><meta http-equiv="refresh" content="0; url=../"></noscript>
</head>
<body style="font-family: system-ui, sans-serif; margin: 2rem 1rem; line-height: 1.4">
  <p>La vista previa se ha mudado a la web de siempre.</p>
  <p><a href="../">Ir a Ollada</a></p>
  <script>
    // Da de baja el service worker de la vista previa (si lo hay) y va a la raíz con la misma ruta (#/hoy)
    var ir = function () { location.replace("../" + location.hash); };
    if (navigator.serviceWorker) {
      navigator.serviceWorker.getRegistration("./").then(function (registro) { return registro && registro.unregister(); }).then(ir, ir);
    } else {
      ir();
    }
  </script>
</body>
</html>
