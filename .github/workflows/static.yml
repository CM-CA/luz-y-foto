# Publica el sitio en GitHub Pages: la versión nueva (Svelte), compilada desde master, en https://cm-ca.github.io/luz-y-foto/
#
#   construir  valida los datos, pasa las pruebas (lógica y navegador), compila y prepara lo que se publica.
#              Se ejecuta en cada push a master y en cada pull request a master (así una PR se prueba con este mismo flujo).
#   publicar   solo en un push a master (o a mano desde Actions sobre master) y solo si construir salió bien.
#              Una pull request nunca publica nada.
#
# Lo que se publica es la carpeta dist/ (npm run build) más transicion/: la redirección de /beta/ (la vista previa de la
# migración ya no existe) y el 404.html que lleva a la app desde cualquier dirección vieja.
#
# Vuelta atrás: devolver master al commit 8d83511, el último con el flujo de transición (publicaba la web antigua en la
# raíz y la nueva en /beta/). Ese flujo compila la versión nueva desde la rama migracion-svelte, y esa rama NO debe subirse
# de nuevo: su flujo viejo volvería a publicar la web antigua en la raíz.
name: Publicar sitio

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  # Permite ejecutarlo a mano desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar los datos (data/)
        run: npm run validar

      - name: Pruebas de lógica
        run: npm test

      - name: Instalar el navegador de las pruebas
        run: npx playwright install --with-deps chromium

      # Compila la app y le pasa las pruebas de comportamiento, de ruta base, de uso sin conexión y de la redirección de /beta/
      - name: Pruebas de navegador (versión compilada)
        run: npm run test:navegador

      - name: Compilar para /luz-y-foto/
        run: npm run build

      # Después de compilar: el service worker de la app guarda todo lo que hay en dist/ al compilar, y esto no es de la app
      - name: Añadir la redirección de /beta/ y el 404
        run: cp -r transicion/. dist/

      - name: Subir el sitio
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Una sola publicación a la vez; las ya iniciadas se terminan, no se cancelan
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
